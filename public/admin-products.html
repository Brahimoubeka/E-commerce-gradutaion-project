<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omervita – Admin Products</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">Omervita Admin</div>
        <nav class="main-nav">
            <a href="index.html">HOME</a>
            <a href="admin-products.html">Products</a>
            <a href="admin-messages.html">Messages</a>
        </nav>
        <div class="user-actions">
            <a href="logout.html">Logout</a>
        </div>
    </header>

    <main>
        <h1>Manage Products</h1>

        <!-- Section to add a new product -->
        <section id="add-product">
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br>

                <label for="description">Description:</label>
                <textarea id="description" name="description"></textarea><br>

                <label for="price">Price:</label>
                <input type="number" step="0.01" id="price" name="price" required><br>

                <label for="stock">Stock:</label>
                <input type="number" id="stock" name="stock" required><br>

                <label for="image">Image:</label>
                <input type="file" id="image" accept="image/*"><br>

                <button type="submit">Add Product</button>
            </form>
            <div id="add-product-message"></div>
        </section>

        <!-- Section to display existing products -->
        <section id="product-list">
            <h2>Existing Products</h2>
            <div id="products-container" class="products-grid"></div>
        </section>
    </main>

    <footer>
        <!-- your footer here… -->
    </footer>

    <script src="js/header.js"></script>
    <script src="js/admin-products.js"></script>
</body>
</html>
